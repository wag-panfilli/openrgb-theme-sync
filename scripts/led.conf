# LED color correction for omarchy-openrgb-theme-sync (sourced as shell).
# Theme hex colors are sRGB (made for monitors); LEDs are linear PWM, so the
# picker linearizes, white-balances and normalizes to full brightness.
# After editing, re-apply with: omarchy-openrgb-theme-sync

# 0 = send the theme's hex untouched (old behaviour)
OPENRGB_LED_CORRECTION=1

# "srgb" = exact sRGB curve. Lower number (e.g. 1.8) = less saturated/whiter;
# higher (2.6) = deeper colors.
OPENRGB_LED_GAMMA=srgb

# Per-channel max, R G B. Calibrate with a white/gray theme (e.g. `white`):
#   white looks greenish/cyan -> lower the middle byte (G)
#   white looks bluish/purple -> lower the last byte (B)
#   white looks pinkish/warm  -> lower the first byte (R)
# FFFFFF disables white balance.
OPENRGB_LED_WHITE_BALANCE=FFB0F0

# Where the RGB color comes from:
#   wallpaper = dominant vivid color of the current background (falls back to
#               the theme color when the wallpaper is grayscale)
#   theme     = the theme's keyboard.rgb / accent (old behaviour)
# Preview a wallpaper: omarchy-openrgb-pick-colors.py --image <file>
OPENRGB_COLOR_SOURCE=wallpaper

# Wallpapers that are mostly black (>60%) with the rest white/gray (only small
# specks of color) get this color instead of the theme color. Sent to the LEDs
# exactly as written (no LED correction above). FFFFFF = pure white.
OPENRGB_DARK_WALLPAPER_COLOR=FFFFFF
