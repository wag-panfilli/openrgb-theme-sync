# Per-wallpaper RGB color, overriding the automatic wallpaper analysis.
# Format: <wallpaper file name> = RRGGBB   (file name only, spaces are fine)
# Sent to the LEDs exactly as written (no LED correction), so dim/dark colors
# stay dark. Changes apply on the next wallpaper/theme change, or run:
#   omarchy-openrgb-theme-sync

