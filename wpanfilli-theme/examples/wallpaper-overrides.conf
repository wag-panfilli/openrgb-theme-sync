# Per-wallpaper primary color, overriding the automatic wallpaper analysis.
# Copy to ~/.config/omarchy-wpanfilli/wallpaper-overrides.conf
# Format: <wallpaper file name> = RRGGBB   (file name only, spaces are fine)
# The color is still brought to the theme's lightness range (readable on the
# dark background). Applies on the next wallpaper change, or run:
#   omarchy-theme-wpanfilli-render --force

Girl with Hannya Mask.jpeg = 8B0000
